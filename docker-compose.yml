services:
  postgres:
    image: postgres:16-alpine
    container_name: chusetts-web-postgres
    environment:
      POSTGRES_USER: chusetts
      POSTGRES_PASSWORD: chusetts_dev_only
      POSTGRES_DB: chusetts
    ports:
      # 54329 avoids clashing with a locally installed Postgres on 5432.
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chusetts -d chusetts"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
